[package]
name = "colui-tauri"
version = "0.1.0"
edition = "2021"
default-run = "colui-tauri"
license.workspace = true

[lib]
name = "colui_tauri_lib"
path = "src/lib.rs"

[[bin]]
name = "colui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
colui-app = { path = "../crates/colui-app" }
colui-adapters = { path = "../crates/colui-adapters" }
colui-domain = { path = "../crates/colui-domain" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
