[package]
name = "colui-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
bollard = "0.18"
colui-app = { path = "../colui-app" }
colui-domain = { path = "../colui-domain" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
