[package]
name = "colui-adapters"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
bollard = "0.18"
chrono = "0.4"
colui-app = { path = "../colui-app" }
colui-domain = { path = "../colui-domain" }
fs2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }

[features]
docker-tests = ["test-support"]
test-support = []

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["test-util", "net"] }
tempfile = "3"

[[test]]
name = "runtime"
required-features = ["test-support"]

[[test]]
name = "docker"
required-features = ["docker-tests"]
