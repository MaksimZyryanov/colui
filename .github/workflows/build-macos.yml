name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-latest-release
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build unsigned DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build DMG
        run: pnpm tauri:build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: colui-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
            gh release edit latest \
              --title "Latest macOS build" \
              --notes "Unsigned macOS build from commit ${GITHUB_SHA}." \
              --latest
            gh release upload latest target/release/bundle/dmg/*.dmg --clobber
          else
            gh release create latest target/release/bundle/dmg/*.dmg \
              --target "${GITHUB_SHA}" \
              --title "Latest macOS build" \
              --notes "Unsigned macOS build from commit ${GITHUB_SHA}." \
              --latest
          fi
